version: "2"

linters:
  enable:
    - depguard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    depguard:
      rules:
        domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/giovaniif/agent-workspace/internal
              desc: domain has no imports from other internal packages
        app:
          files:
            - "**/internal/app/**"
          deny:
            - pkg: github.com/giovaniif/agent-workspace/internal/adapters
              desc: app depends only on domain
            - pkg: github.com/giovaniif/agent-workspace/internal/daemon
              desc: app depends only on domain
            - pkg: github.com/giovaniif/agent-workspace/internal/rpc
              desc: app depends only on domain
            - pkg: github.com/giovaniif/agent-workspace/internal/tui
              desc: app depends only on domain
        tui:
          files:
            - "**/internal/tui/**"
          deny:
            - pkg: github.com/giovaniif/agent-workspace/internal/adapters
              desc: tui talks only to rpc
            - pkg: github.com/giovaniif/agent-workspace/internal/app
              desc: tui talks only to rpc
            - pkg: github.com/giovaniif/agent-workspace/internal/daemon
              desc: tui talks only to rpc
        serve:
          files:
            - "**/internal/serve/**"
          list-mode: lax
          allow:
            - github.com/giovaniif/agent-workspace/internal/rpc
            - github.com/giovaniif/agent-workspace/internal/domain
            - github.com/giovaniif/agent-workspace/internal/serve
          deny:
            - pkg: github.com/giovaniif/agent-workspace/internal
              desc: serve talks to the daemon only through rpc and may import domain types
            - pkg: os/exec
              desc: serve runs nothing; cmd/agentws starts the daemon
        rpcpipe:
          files:
            - "**/internal/rpcpipe/**"
          list-mode: lax
          allow:
            - github.com/giovaniif/agent-workspace/internal/rpc
          deny:
            - pkg: github.com/giovaniif/agent-workspace/internal
              desc: the stdio bridge reaches the daemon only through rpc
            - pkg: os/exec
              desc: the stdio bridge never starts a daemon
        no-exec-outside-adapters:
          files:
            - "**/internal/domain/**"
            - "**/internal/app/**"
            - "**/internal/tui/**"
            - "**/internal/rpc/**"
            - "**/internal/daemon/**"
          deny:
            - pkg: os/exec
              desc: only adapters shell out; tmux calls live in internal/adapters/tmux
        no-chroma-registries:
          files:
            - "$all"
          deny:
            - pkg: github.com/alecthomas/chroma/v2/lexers
              desc: its init builds every lexer and slows each hook run; add XML lexers to internal/tui/syntax
            - pkg: github.com/alecthomas/chroma/v2/styles
              desc: its init parses every style and slows each hook run; syntax colors come from the theme
        tmux-adapter-only-via-daemon:
          files:
            - "**/internal/**"
            - "!**/internal/daemon/**"
            - "!**/internal/adapters/tmux/**"
          deny:
            - pkg: github.com/giovaniif/agent-workspace/internal/adapters/tmux
              desc: only the daemon wires the tmux adapter

formatters:
  enable:
    - gofmt
