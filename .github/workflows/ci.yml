name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-only: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      - run: npm test
        working-directory: web
      - run: AGENTWS_WEB_BUILT=1 go test ./internal/serve/ -run Static
      - run: make build
      - run: ./bin/agentws version
      - run: make lint
      - run: BUDGET_SCALE=2 scripts/bench-hook.sh ./bin/agentws
      - run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - run: brew list neovim >/dev/null 2>&1 || brew install neovim
      - run: go test ./...
      - run: go vet -tags integration -composites=false ./...
      - run: go test -p 2 -tags integration ./...

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test
        working-directory: macos
        env:
          AGENTWS_SNAPSHOTS: ${{ runner.temp }}/snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn
      - run: macos/build-app
      - run: codesign --verify --verbose macos/build/agentws.app
      - run: test -f macos/build/agentws.app/Contents/Resources/AppIcon.icns
      - run: '[ "$(plutil -extract CFBundleIconFile raw macos/build/agentws.app/Contents/Info.plist)" = AppIcon ]'

  tdd:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - run: brew list neovim >/dev/null 2>&1 || brew install neovim
      - run: cp scripts/tdd-check "$RUNNER_TEMP/" && "$RUNNER_TEMP/tdd-check" "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
        env:
          TDD_PR_TITLE: ${{ github.event.pull_request.title }}

  mutate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - run: make mutate
