name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-only: true
      - run: make build
      - run: ./bin/agentws version
      - run: make lint
      # why: shared macOS runners start processes about 3x slower than a dev Mac; the real budget is checked locally.
      - run: BUDGET_SCALE=2 scripts/bench-hook.sh ./bin/agentws
      # why: the e2e suite in ./test/e2e runs a real tmux server.
      - run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - run: brew list neovim >/dev/null 2>&1 || brew install neovim
      - run: go test ./...
      - run: go vet -tags integration -composites=false ./...
      - run: go test -p 2 -tags integration ./...

  tdd:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: cp scripts/tdd-check "$RUNNER_TEMP/" && "$RUNNER_TEMP/tdd-check" "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
        env:
          TDD_PR_TITLE: ${{ github.event.pull_request.title }}

  mutate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - run: make mutate
