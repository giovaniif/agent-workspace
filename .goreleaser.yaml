version: 2

project_name: crew

before:
  hooks:
    - env -u GITHUB_TOKEN -u GH_TOKEN make web

builds:
  - main: ./cmd/crew
    binary: crew
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    ldflags:
      - -s -w -X github.com/giovaniif/crew/internal/version.Version={{ .Tag }} -X github.com/giovaniif/crew/internal/version.Commit={{ .ShortCommit }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - nvim/lua/**/*
      - nvim/plugin/*

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  prerelease: auto
